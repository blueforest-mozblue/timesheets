<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MozBlue Timesheets</title>
<meta name="theme-color" content="#1f5f45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="alternate icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<script src="config.js"></script>
<script src="xlsx.full.min.js" defer></script>
<style>
/* Field-first layout: light, high-contrast surfaces readable outdoors; one green accent for actions; status carried by small coloured chips. */
:root{
  color-scheme:light;
  --bg:#f3f5f1; --card:#ffffff; --ink:#11231b; --ink-2:#2f443a; --muted:#5d6e66; --faint:#8a9891; --line:#dfe5df; --line-2:#cbd5cd;
  --brand:#1f5f45; --brand-2:#2c7a5a; --brand-ink:#ffffff; --wash:#e5f1ea;
  --ok:#2c7a5a; --ok-wash:#e2f2e8; --warn:#9a6212; --warn-wash:#fbefd9; --bad:#b23a26; --bad-wash:#fbe5e0; --info:#2d5aa8; --info-wash:#e5ecf9; --off:#7a6aa0; --off-wash:#eeeaf6;
  --font-display:"Outfit",ui-rounded,system-ui,sans-serif; --font-ui:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; --font-code:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:16px; --shadow:0 1px 2px rgba(17,35,27,.06),0 6px 20px rgba(17,35,27,.05);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0f1714; --card:#16211c; --ink:#e8efea; --ink-2:#c8d4cd; --muted:#97a69e; --faint:#6f7e77; --line:#24322b; --line-2:#33443b;
  --brand:#3d9a72; --brand-2:#4fb085; --brand-ink:#0b1410; --wash:#1b2c24; --ok:#62c08f; --ok-wash:#173024; --warn:#e2ac5a; --warn-wash:#2e2414; --bad:#f08470; --bad-wash:#33201b; --info:#8eaef0; --info-wash:#1b2436; --off:#b6a6dd; --off-wash:#241f33; --shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0f1714; --card:#16211c; --ink:#e8efea; --ink-2:#c8d4cd; --muted:#97a69e; --faint:#6f7e77; --line:#24322b; --line-2:#33443b;
  --brand:#3d9a72; --brand-2:#4fb085; --brand-ink:#0b1410; --wash:#1b2c24; --ok:#62c08f; --ok-wash:#173024; --warn:#e2ac5a; --warn-wash:#2e2414; --bad:#f08470; --bad-wash:#33201b; --info:#8eaef0; --info-wash:#1b2436; --off:#b6a6dd; --off-wash:#241f33; --shadow:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg)}
body{color:var(--ink);font-family:var(--font-ui);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand);text-underline-offset:2px}
:focus-visible{outline:2px solid var(--brand-2);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-left,0px))}
/* header */
header.top{position:sticky;top:0;z-index:10;background:var(--brand);color:#fff;padding-top:env(safe-area-inset-top,0px)}
header.top .wrap{display:flex;align-items:center;gap:12px;min-height:58px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{width:34px;height:34px;flex:none}
.brand b{font-family:var(--font-display);font-weight:600;font-size:19px;line-height:1;display:block}
.brand small{font-family:var(--font-display);font-size:10px;letter-spacing:.24em;text-transform:uppercase;opacity:.8;display:block;margin-top:3px}
.hbtn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
.hbtn:hover{background:rgba(255,255,255,.2)}
.sync{font-size:12px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.pending{background:#f3c26b;color:#3a2a08}.sync.off{background:#f08470;color:#2a0d07}
@media (max-width:520px){.hide-sm{display:none}}
.banner{background:var(--warn-wash);color:var(--warn);font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav.tabs .in{display:flex;gap:4px;max-width:640px;width:100%}
nav.tabs button{flex:1;border:0;background:none;padding:6px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer;position:relative;font-family:var(--font-display);min-width:0}
nav.tabs button>span:not(.badge){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
nav.tabs button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand);background:var(--wash)}
nav.tabs .badge{position:absolute;top:2px;right:calc(50% - 22px);background:var(--bad);color:#fff;border-radius:999px;font-size:10.5px;min-width:18px;height:18px;line-height:18px;padding:0 5px;font-family:var(--font-ui);font-weight:600}
/* common */
h1.pt{font-family:var(--font-display);font-weight:600;font-size:clamp(24px,4vw,30px);letter-spacing:-.01em;margin:22px 0 4px}
.sub{color:var(--muted);margin:0 0 14px;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:12px}
.card h3{font-family:var(--font-display);font-weight:500;font-size:17px;margin:0 0 8px}
.btn{border:1px solid var(--line-2);background:var(--card);border-radius:12px;padding:10px 16px;cursor:pointer;font-weight:500;color:var(--ink)}
.btn:hover{border-color:var(--brand-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:var(--brand-2)}
.btn.sm{padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.ghost{border-color:transparent;background:none}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted);font-weight:500;min-width:0}
input,select,textarea{background:var(--card);border:1px solid var(--line-2);border-radius:12px;padding:11px 12px;width:100%;min-width:0;font-size:16px;color:var(--ink)}
textarea{min-height:96px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand-2);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand-2) 20%,transparent)}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.g2{grid-template-columns:minmax(0,1fr)}}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--wash);color:var(--brand);white-space:nowrap}
.chip.ok{background:var(--ok-wash);color:var(--ok)}.chip.warn{background:var(--warn-wash);color:var(--warn)}.chip.bad{background:var(--bad-wash);color:var(--bad)}.chip.info{background:var(--info-wash);color:var(--info)}.chip.off{background:var(--off-wash);color:var(--off)}.chip.mute{background:color-mix(in srgb,var(--line) 70%,transparent);color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:var(--font-code);font-size:12.5px}
.empty{color:var(--faint);padding:10px 0}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
/* login */
.login{max-width:420px;margin:36px auto}
.login .logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.login .logo svg{width:56px;height:56px;border-radius:14px;box-shadow:0 4px 14px rgba(31,95,69,.25)}
.login h1{font-family:var(--font-display);font-size:26px;margin:0}
.pin{font-family:var(--font-code);letter-spacing:.4em;font-size:22px;text-align:center}
/* day */
.dayhead{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:8px;margin-top:18px}
.dayhead .nav{width:44px;height:44px;border-radius:12px;border:1px solid var(--line-2);background:var(--card);cursor:pointer;font-size:22px;line-height:1}
.dayhead .mid{text-align:center}
.dayhead .mid b{font-family:var(--font-display);font-weight:600;font-size:21px;display:block;line-height:1.2}
.dayhead .mid span{font-size:13px;color:var(--muted)}
.daytools{display:flex;gap:8px;justify-content:center;margin:10px 0 14px;flex-wrap:wrap}
.daytools input{width:auto;padding:7px 10px;font-size:14px}
.entry{border-left:4px solid var(--brand-2)}
.entry.offday{border-left-color:var(--off)}
.entry .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.entry .area{font-weight:600;margin-top:6px}
.entry .meta{font-size:13px;color:var(--muted);margin-top:2px}
.entry .sum{margin-top:8px;white-space:pre-wrap;color:var(--ink-2)}
.flagbox{margin-top:12px;border-radius:12px;padding:10px 12px;background:var(--warn-wash);border:1px solid color-mix(in srgb,var(--warn) 25%,transparent)}
.flagbox.done{background:color-mix(in srgb,var(--line) 45%,transparent);border-color:var(--line)}
.flagbox .q{font-size:14px;color:var(--ink)}
.flagbox .who{font-size:12px;color:var(--muted);margin-bottom:3px}
.flagbox .a{margin-top:8px;font-size:14px;padding-left:10px;border-left:3px solid var(--brand-2)}
.flagbox textarea{min-height:64px;margin-top:8px;background:var(--card)}
.pend{font-size:11.5px;color:var(--warn);font-weight:600}
/* calendar */
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:999px;padding:3px;margin:0 0 12px;background:var(--card)}
.seg button{border:0;background:none;padding:7px 16px;border-radius:999px;font:inherit;font-size:14px;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.tgrid{overflow-x:auto;-webkit-overflow-scrolling:touch;margin:0 -4px}
.tgrid table{border-collapse:separate;border-spacing:3px;font-size:12px}
.tgrid th{font-weight:500;color:var(--muted);text-align:center;min-width:26px;line-height:1.15;font-family:var(--font-ui)}
.tgrid th span{display:block;font-size:10px;color:var(--faint);text-transform:uppercase}
.tgrid th.we{opacity:.45}.tgrid th.td{color:var(--ink);font-weight:700}
.tgrid th.nm{position:sticky;left:0;z-index:1;background:var(--card);text-align:left;white-space:nowrap;padding-right:8px;color:var(--ink);font-weight:600;font-size:13px;cursor:pointer;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.tgrid td{padding:0}
.tgrid .c{display:block;width:26px;height:26px;border-radius:7px;border:1px solid var(--line);background:transparent;padding:0;cursor:pointer}
.tgrid .c.filled{background:var(--cal-ok);border-color:var(--cal-ok)}
.tgrid .c.missing{background:var(--cal-miss);border-color:var(--cal-miss)}
.tgrid .c.flag{background:var(--cal-flag);border-color:var(--cal-flag)}
.tgrid .c.offd{background:var(--cal-off);border-color:var(--cal-off)}
.tgrid .c.weekend{opacity:.4}
.tgrid .c.future{border-style:dashed}.tgrid .c.future.we{opacity:.4}
.tgrid .c.td{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.part{display:flex;flex-direction:column;gap:12px}
.part+.part{border-top:1px dashed var(--line-2);padding-top:14px}
.parthead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.parthead b{font-family:var(--font-display);font-size:14px;color:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.cal .wd{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--faint);text-align:center;padding-bottom:2px}
.cal .d{aspect-ratio:1/1;border-radius:12px;border:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;position:relative;font-family:var(--font-display);font-size:16px;padding:0}
:root{--cal-ok:#2c7a5a;--cal-miss:#c2570c;--cal-flag:#c0262d;--cal-off:#6d5d96}
.cal .d small{font-size:9.5px;font-family:var(--font-ui);color:var(--muted);line-height:1}
.cal .d.filled,.cal .d.missing,.cal .d.flag,.cal .d.offd{color:#fff;font-weight:600}
.cal .d.filled small,.cal .d.missing small,.cal .d.flag small,.cal .d.offd small{color:rgba(255,255,255,.85)}
.cal .d.filled{background:var(--cal-ok);border-color:var(--cal-ok)}
.cal .d.missing{background:var(--cal-miss);border-color:var(--cal-miss)}
.cal .d.flag{background:var(--cal-flag);border-color:var(--cal-flag)}
.cal .d.offd{background:var(--cal-off);border-color:var(--cal-off)}
.cal .d.weekend{background:transparent;color:var(--faint);opacity:.4}
.cal .d.future{color:var(--faint);background:transparent;border-style:dashed}
.cal .d.future.we{opacity:.4}
.cal .d.today{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--ink)}
.cal .d .dot{position:absolute;top:5px;right:6px;width:7px;height:7px;border-radius:50%;background:#fff}
.cal .pad{visibility:hidden}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.pnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:16px 0 12px}
.pnav b{font-family:var(--font-display);font-weight:500;font-size:17px;text-align:center}
.sumtable{width:100%;border-collapse:collapse;font-size:14px}
.sumtable td{padding:7px 0;border-top:1px solid var(--line)}
.sumtable td:last-child{text-align:right;font-family:var(--font-code)}
.sumtable tr.tot td{font-weight:600;border-top:2px solid var(--line-2)}
/* team */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi b{font-family:var(--font-display);font-size:26px;font-weight:500;display:block;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.alert b{color:var(--bad)}
.person{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 4px;border-top:1px solid var(--line);cursor:pointer}
.person:first-child{border-top:0}
.person:hover{background:color-mix(in srgb,var(--wash) 50%,transparent)}
.av{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--wash);color:var(--brand);font-family:var(--font-display);font-weight:600}
.person b{font-weight:600}
.person .meta{font-size:12.5px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px;max-width:260px}
.bar i{display:block;height:100%;background:var(--ok)}
.person .r{text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.erow{display:grid;grid-template-columns:86px minmax(0,1fr) auto;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:start}
.erow:first-child{border-top:0}
.erow .dt{font-family:var(--font-code);font-size:12.5px;color:var(--muted)}
.erow .dt b{display:block;font-family:var(--font-display);font-size:15px;color:var(--ink);font-weight:500}
.erow .txt{min-width:0}
.erow .txt .l1{font-weight:600;font-size:14px}
.erow .txt .l2{font-size:13px;color:var(--muted)}
.erow .txt .l3{font-size:14px;margin-top:4px;white-space:pre-wrap;color:var(--ink-2)}
.erow.miss .txt .l1{color:var(--bad)}
@media (max-width:560px){.erow{grid-template-columns:64px minmax(0,1fr)}.erow>.act{grid-column:2}}
.compose{margin-top:8px;display:flex;flex-direction:column;gap:8px}
.compose textarea{min-height:64px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
.quick button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.filters{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:12px}
@media (max-width:720px){.filters{grid-template-columns:repeat(2,minmax(0,1fr))}}
.filters input,.filters select{padding:8px 10px;font-size:14px}
.segs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.segs button{border:1px solid var(--line-2);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13.5px;cursor:pointer;color:var(--ink-2)}
.segs button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.listedit textarea{min-height:120px;font-size:14px}
.wtrow{display:grid;grid-template-columns:minmax(0,1fr) auto 32px;gap:8px;align-items:center;margin-bottom:8px}
.wtrow label{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;white-space:nowrap}
.wtrow input[type=checkbox]{width:18px;height:18px;padding:0;accent-color:var(--brand)}
.x{border:0;background:none;color:var(--faint);font-size:22px;cursor:pointer;line-height:1}
.x:hover{color:var(--bad)}
.back{border:0;background:none;color:var(--brand);font-weight:600;cursor:pointer;padding:16px 0 0;font-size:14.5px}
@media (min-width:900px){
  body{padding-bottom:20px}
  nav.tabs{position:sticky;top:58px;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:4px}
  nav.tabs .in{max-width:980px}
  nav.tabs button{flex-direction:row;justify-content:center;gap:8px;font-size:14px;padding:9px}
  nav.tabs .badge{position:static}
  .toast{bottom:28px}
}
.areaq{margin:12px 0 10px;padding:9px 12px;font-size:15px}
.newarea{display:flex;gap:8px;align-items:center;margin:10px 0}
.newarea input{padding:9px 12px;font-size:15px}
.area{border:1px solid var(--line);border-radius:12px;margin-bottom:8px;background:var(--card)}
.area.open{border-color:var(--line-2)}
.ahead{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;background:none;border:0;padding:12px 14px;cursor:pointer;text-align:left;color:var(--ink);font:inherit}
.ahead .chev{font-size:20px;color:var(--faint);transition:transform .15s}
.area.open .chev{transform:rotate(90deg)}
.abody{padding:0 14px 14px;display:flex;flex-direction:column;gap:6px}
.achips{display:flex;flex-wrap:wrap;gap:6px}
.achip{display:inline-flex;align-items:center;gap:4px;background:var(--wash);color:var(--ink-2);border-radius:999px;padding:4px 4px 4px 11px;font-size:13px}
.achip button{border:0;background:none;color:var(--faint);cursor:pointer;font-size:16px;line-height:1;width:22px;height:22px;border-radius:50%}
.achip button:hover{color:var(--bad);background:var(--bad-wash)}
.savebar{position:sticky;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:5;display:flex;align-items:center;gap:8px;background:var(--ink);color:var(--bg);padding:10px 12px 10px 16px;border-radius:14px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.savebar .btn{border-color:transparent}
@media (min-width:900px){.savebar{bottom:16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top"><div class="wrap">

let lang = store.get("ts-lang", (navigator.language || "").toLowerCase().startsWith("pt") ? "pt" : "en");
const t = k => (L[lang][k] ?? L.en[k] ?? k);
const fmtDay = s => { const d = dt(s); return t("wdLong")[d.getDay()] + ", " + d.getDate() + " " + t("months")[d.getMonth()]; };
const fmtShort = s => { const d = dt(s); return d.getDate() + " " + t("months")[d.getMonth()].slice(0, 3); };
const fmtLong = s => { const d = dt(s); return d.getDate() + " " + t("months")[d.getMonth()] + " " + d.getFullYear(); };

// ---------- backend: Supabase (one database function, ts_api)
const CFG = window.TS_CONFIG || {};
const params = new URLSearchParams(location.search);
const SB_URL = (params.get("sbUrl") || CFG.supabaseUrl || "").replace(/\/+$/, "");
const SB_KEY = params.get("sbKey") || CFG.supabaseKey || "";
const CONFIGURED = !!(SB_URL && SB_KEY);
function sbHeaders(bearer){ const h = {"Content-Type": "application/json", "apikey": SB_KEY}; if (bearer) h.Authorization = "Bearer " + bearer; else if (SB_KEY.startsWith("eyJ")) h.Authorization = "Bearer " + SB_KEY; return h; }   // legacy anon keys are JWTs; publishable keys go in apikey only
async function call(req, bearer){
  const r = await fetch(SB_URL + "/rest/v1/rpc/ts_api", {method:"POST", headers: sbHeaders(bearer), body: JSON.stringify({req})});
  if (!r.ok) throw new Error("http_" + r.status);
  return await r.json();
}
async function authed(action, extra){
  const res = await call({action, staffId: S.session.staffId, token: S.session.token, ...(extra || {})});
  if (!res.ok && res.error === "not_signed_in"){ signOut(true); toast(t("signedOut")); throw new Error("not_signed_in"); }
  return res;
}

// ---------- state
const S = {
  session: store.get("ts-session", null), staff: [], lists: null, teamView: store.get("ts-teamview", "list"), today: iso(new Date()),
  me: null, entries: [], flags: [], outbox: [], tab: null, date: iso(new Date()), pStart: null, edit: null,
  team: null, teamKey: "", person: null, filter: {who:"", wt:"", area:"", q:""}, flagFilter: "open", composing: null, editStaff: null, online: navigator.onLine
};
const cacheKey = () => "ts-cache-" + (S.session ? S.session.staffId : "");
const outKey = () => "ts-outbox-" + (S.session ? S.session.staffId : "");
function persist(){ if (!S.session) return; store.set(cacheKey(), {entries:S.entries, flags:S.flags, lists:S.lists, me:S.me, staff:S.staff}); store.set(outKey(), S.outbox); }
const isAdmin = () => S.session && S.session.role === "admin";

// ---------- periods and day status
const psd = () => (S.lists && S.lists.periodStartDay) || 15;
function periodStart(s){ const d = dt(s); let y = d.getFullYear(), m = d.getMonth(); if (d.getDate() < psd()){ m--; if (m < 0){ m = 11; y--; } } return y + "-" + pad(m + 1) + "-" + pad(psd()); }
function periodEnd(start){ const d = dt(start); const e = new Date(d.getFullYear(), d.getMonth() + 1, psd()); e.setDate(e.getDate() - 1); return iso(e); }
function shiftPeriod(start, n){ const d = dt(start); return iso(new Date(d.getFullYear(), d.getMonth() + n, psd())); }
function daysIn(a, b){ const out = []; for (let s = a; s <= b; s = addDays(s, 1)) out.push(s); return out; }
const periodLabel = start => fmtLong(start) + " – " + fmtLong(periodEnd(start));
const isWeekend = s => { const g = dt(s).getDay(); return g === 0 || g === 6; };
const wtInfo = name => (S.lists && S.lists.workTypes || []).find(w => w.name === name) || {name, working: true};
const isWorking = name => !!wtInfo(name).working;
function dayStatus(s, list){
  const es = list.filter(e => e.date === s && !e.deleted);
  if (es.length) return es.some(e => isWorking(e.workType)) ? "filled" : "offd";
  if (s > S.today) return "future";
  if (isWeekend(s)) return "weekend";
  return "missing";
}
function periodStats(start, list){
  const end = periodEnd(start), all = daysIn(start, end), upto = all.filter(s => s <= S.today);
  const expected = upto.filter(s => !isWeekend(s)), filledWd = expected.filter(s => list.some(e => e.date === s && !e.deleted));
  const byType = {}; all.forEach(s => { const types = new Set(list.filter(e => e.date === s && !e.deleted).map(e => e.workType || "?")); types.forEach(w => byType[w] = (byType[w] || 0) + 1); });
  const working = all.filter(s => list.some(e => e.date === s && !e.deleted && isWorking(e.workType))).length;
  const last = list.filter(e => !e.deleted).map(e => e.date).sort().pop() || "";
  return {all, expected: expected.length, filled: filledWd.length, missing: expected.length - filledWd.length, missingDays: expected.filter(s => !filledWd.includes(s)), byType, working, last};
}

// ---------- sync for staff entries (works offline: changes queue on the phone until the server confirms)
function setSync(){
  const el = $("#sync"); if (!S.session){ el.hidden = true; return; }
  el.hidden = false; const n = S.outbox.length;
  el.className = "sync" + (!S.online ? " off" : n ? " pending" : "");
  el.textContent = !S.online ? t("offline") + (n ? " · " + n : "") : n ? n + " " + t("waiting") : t("saved");
}
let flushing = false;
async function flush(){
  if (flushing || !S.outbox.length || !S.session) { setSync(); return; }
  flushing = true; setSync();
  try {
    const batch = S.outbox.slice(0, 50);
    const res = await authed("saveEntries", {entries: batch});
    if (res.ok){ const ok = new Set(res.saved.map(x => x.id).concat(res.skipped || [])); S.outbox = S.outbox.filter(x => !ok.has(x.id)); S.online = true; persist(); }
  } catch(e){ if (e.message !== "not_signed_in") S.online = false; }
  flushing = false; setSync();
  if (S.outbox.length && S.online) setTimeout(flush, 500);
}
function saveLocal(entry){
  entry.updatedAt = new Date().toISOString();
  const i = S.entries.findIndex(e => e.id === entry.id); if (i >= 0) S.entries[i] = entry; else S.entries.push(entry);
  const j = S.outbox.findIndex(e => e.id === entry.id); if (j >= 0) S.outbox[j] = entry; else S.outbox.push(entry);
  persist(); flush();
}
async function loadMine(){
  try {
    const res = await authed("myData", {});
    if (!res.ok) return;
    S.online = true; S.me = res.me; S.lists = res.lists || S.lists; S.today = res.today || S.today;
    const pend = new Map(S.outbox.map(e => [e.id, e]));
    S.entries = res.entries.filter(e => !pend.has(e.id)).concat([...pend.values()]);
    S.flags = res.flags; persist(); flush(); render();
  } catch(e){ if (e.message !== "not_signed_in"){ S.online = false; setSync(); } }
}
window.addEventListener("online", () => { S.online = true; flush(); loadMine(); });
window.addEventListener("offline", () => { S.online = false; setSync(); });
setInterval(() => { if (S.session && S.outbox.length) flush(); }, 60000);

}
const PIN_RE = /^[A-Za-z0-9]{4,8}$/;
const pinInput = (id, ac) => `<input id="${id}" class="pin" type="password" autocomplete="${ac}" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="8" required>`;
const errText = code => t("e_" + code) !== "e_" + code ? t("e_" + code) : (code === "wrong_pin" ? t("wrongPin") : code === "locked" ? t("locked") : t("netErr"));
function preAuth(){ $("#tabs").hidden = true; $("#whoBtn").hidden = true; setSync(); }
async function boot(){
  $("#langBtn").textContent = lang === "pt" ? "PT | EN" : "EN | PT"; document.documentElement.lang = lang;
  $("#brandSub").textContent = t("appSub");
  if (!CONFIGURED){ preAuth(); $("#main").innerHTML = shell(`<div class="card">${esc(t("notConfigured"))}</div>`); return; }
  if (S.session){
    const c = store.get(cacheKey(), null); if (c){ S.entries = c.entries || []; S.flags = c.flags || []; S.lists = c.lists; S.me = c.me; S.staff = c.staff || []; }
    S.outbox = store.get(outKey(), []);
    S.tab = S.tab || (isAdmin() ? "team" : "day"); render(); loadMine();
    return;
  }
  renderLogin();
  try { const b = await call({action:"bootstrap"}); if (b.ok){ S.lists = b.lists; S.today = b.today || S.today; } } catch(e){}
}
function startSession(res){
  S.session = {staffId: res.me.id, token: res.token, role: res.me.role, name: res.me.name, username: res.me.username}; store.set("ts-session", S.session);
  store.set("ts-last-username", res.me.username || ""); S.me = res.me; S.tab = isAdmin() ? "team" : "day"; S.date = S.today; boot();
}
function renderLogin(msg){
  preAuth(); S.pre = "login";
  $("#main").innerHTML = shell(`<form class="card" id="loginForm" autocomplete="on" style="display:flex;flex-direction:column;gap:14px">
      <label class="f">${esc(t("username"))}<input id="lgUser" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" value="${esc(store.get("ts-last-username", ""))}" required></label>
      <label class="f">${esc(t("pin"))}${pinInput("lgPin", "current-password")}</label>
      <p class="small" id="lgMsg" style="margin:0;color:var(--bad)">${esc(msg || "")}</p>
      <button class="btn primary" type="submit">${esc(t("signIn"))}</button>
      <div class="row" style="justify-content:space-between"><a href="#" data-act="toSignup">${esc(t("signupCta"))}</a><a href="#" data-act="toForgot">${esc(t("forgot"))}</a></div>
    </form>`);
  if (!$("#lgUser").value) $("#lgUser").focus(); else $("#lgPin").focus();
  $("#loginForm").onsubmit = async ev => {
    ev.preventDefault(); const u = $("#lgUser").value.trim().toLowerCase(), pin = $("#lgPin").value.trim(), msgEl = $("#lgMsg");
    if (!PIN_RE.test(pin)){ msgEl.textContent = t("pinRule"); return; }
    try { const res = await call({action:"login", username: u, pin}); if (!res.ok){ msgEl.textContent = errText(res.error); return; } startSession(res); }
    catch(e){ msgEl.textContent = t("netErr"); }
  };
}
// Step 1: work email must match a staff member. Step 2: choose and confirm a PIN.
function renderSignup(found){
  preAuth(); S.pre = "signup"; S.signup = found || null;
  if (!found){
    $("#main").innerHTML = shell(`<form class="card" id="suForm" style="display:flex;flex-direction:column;gap:14px"><h3>${esc(t("signupTitle"))}</h3><p class="small muted" style="margin:0">${esc(t("signupIntro"))}</p>
        <label class="f">${esc(t("workEmail"))}<input id="suEmail" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="name@blueforest.co" required></label>
        <p class="small" id="suMsg" style="margin:0;color:var(--bad)"></p>
        <button class="btn primary" type="submit">${esc(t("next"))}</button><a href="#" data-act="toLogin">${esc(t("backToSignIn"))}</a></form>`);
    $("#suEmail").focus();
    $("#suForm").onsubmit = async ev => {
      ev.preventDefault(); const email = $("#suEmail").value.trim().toLowerCase(), msgEl = $("#suMsg");
      try {
        const r = await call({action:"signupCheck", email});
        if (!r.ok && r.error === "no_work_email"){ renderPickName(email, r.choices || []); return; }
        if (!r.ok){ msgEl.textContent = errText(r.error); return; }
        renderSignup({email, name: r.name, username: r.username});
      } catch(e){ msgEl.textContent = t("netErr"); }
    };
    return;
  }
  $("#main").innerHTML = shell(`<form class="card" id="suPinForm" style="display:flex;flex-direction:column;gap:14px"><h3>${esc(t("createPinTitle"))}</h3>
      <p style="margin:0">${esc(t("hello"))} ${esc(found.name.split(" ")[0])}.</p>
      <div class="card" style="box-shadow:none;background:var(--wash);margin:0"><div class="small muted">${esc(t("yourUsername"))}</div><div class="mono" style="font-size:20px;color:var(--ink)">${esc(found.username)}</div><div class="small muted" style="margin-top:4px">${esc(t("rememberUser"))}</div></div>
      <label class="f">${esc(t("createPin"))}${pinInput("suPin", "new-password")}</label>
      <label class="f">${esc(t("confirmPin"))}${pinInput("suPin2", "new-password")}</label>
      <p class="small" id="suMsg" style="margin:0;color:var(--bad)"></p>
      <button class="btn primary" type="submit">${esc(t("createAccount"))}</button><a href="#" data-act="toSignup">${esc(t("back"))}</a></form>`);
  $("#suPin").focus();
  $("#suPinForm").onsubmit = async ev => {
    ev.preventDefault(); const p1 = $("#suPin").value.trim(), p2 = $("#suPin2").value.trim(), msgEl = $("#suMsg");
    if (!PIN_RE.test(p1)){ msgEl.textContent = t("pinRule"); return; } if (p1 !== p2){ msgEl.textContent = t("pinMismatch"); return; }
    try { const r = await call({action:"signupComplete", email: found.email, newPin: p1, staffId: found.staffId || ""}); if (!r.ok){ msgEl.textContent = errText(r.error); return; } toast(t("welcome")); startSession(r); }
    catch(e){ msgEl.textContent = t("netErr"); }
  };
}
// No Blue Forest email yet: choose your name from the people who have not registered.
function renderPickName(email, choices){
  preAuth(); S.pre = "pick"; S.pick = {email, choices};
  $("#main").innerHTML = shell(`<form class="card" id="pkForm" style="display:flex;flex-direction:column;gap:14px"><h3>${esc(t("noWorkEmailTitle"))}</h3>
      <p class="small muted" style="margin:0">${esc(t("noWorkEmailText").replace("{email}", email))}</p>
      ${choices.length ? `<label class="f">${esc(t("yourName"))}<select id="pkWho" required><option value="">${esc(t("choose"))}</option>${choices.map(c => `<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select></label>
      <p class="small" id="pkMsg" style="margin:0;color:var(--bad)"></p><button class="btn primary" type="submit">${esc(t("next"))}</button>` : `<p style="margin:0;color:var(--bad)">${esc(t("noChoices"))}</p>`}
      <a href="#" data-act="toSignup">${esc(t("back"))}</a></form>`);
  if (!choices.length) return;
  $("#pkForm").onsubmit = async ev => {
    ev.preventDefault(); const id = $("#pkWho").value, msgEl = $("#pkMsg"); if (!id) return;
    try { const r = await call({action:"signupCheck", email, staffId: id}); if (!r.ok){ msgEl.textContent = errText(r.error); return; } renderSignup({email, staffId: id, name: r.name, username: r.username}); }
    catch(e){ msgEl.textContent = t("netErr"); }
  };
}
function renderForgot(){
  preAuth(); S.pre = "forgot";
  $("#main").innerHTML = shell(`<div class="card" style="display:flex;flex-direction:column;gap:12px"><h3>${esc(t("forgotTitle"))}</h3><p style="margin:0">${esc(t("forgotText"))}</p><a href="#" data-act="toLogin">${esc(t("backToSignIn"))}</a></div>`);
}
function signOut(force){ if (!force && S.session && S.outbox.length){ toast(S.outbox.length + " " + t("unsynced")); flush(); return; } store.del("ts-session"); S.session = null; S.entries = []; S.flags = []; S.team = null; S.tab = null; boot(); }

// ---------- tabs
const ICON = {
  day:'<path d="M4 6h16v14H4z"/><path d="M4 10h16M9 3v4M15 3v4"/>', period:'<rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 13h2M12 13h2M16 13h2M8 17h2M12 17h2"/>',
  feed:'<path d="M4 5h16v11H8l-4 4z"/>', account:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>', team:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c1-3.5 3.5-5.5 6.5-5.5s5.5 2 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.5c2.5 0 4.5 1.6 5.5 4.5"/>',
  entries:'<path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/>', flags:'<path d="M5 21V4h11l-2 4 2 4H5"/>', settings:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/>'
};
function renderTabs(){
  const unread = S.flags.filter(f => f.status === "open").length;
  const openTeam = S.team ? S.team.flags.filter(f => f.status === "answered").length : 0;
  const tabs = isAdmin() ? [["team",t("team")],["entries",t("entries")],["flags",t("flags"),openTeam],["day",t("myDay")],["settings",t("settings")],["account",t("account")]]
    : [["day",t("day")],["period",t("period")],["feed",t("feed"),unread],["account",t("account")]];
  $("#tabsIn").innerHTML = tabs.map(([k,l,b]) => `<button type="button" data-tab="${k}" aria-current="${S.tab === k || (k === "day" && S.tab === "period" && isAdmin()) || (k === "team" && S.tab === "person") ? "page" : "false"}"><svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k === "day" && isAdmin() ? "day" : k]}</svg><span>${esc(l)}</span>${b ? `<span class="badge">${b}</span>` : ""}</button>`).join("");
  $("#tabs").hidden = false;
  $$("#tabsIn [data-tab]").forEach(b => b.onclick = () => { if (S.tab === "settings" && b.dataset.tab !== "settings" && listsDirty() && !window.confirm(t("leaveUnsaved"))) return; if (b.dataset.tab !== "settings") S.draft = null; S.teamAt = 0; S.tab = b.dataset.tab; S.edit = null; S.composing = null; if (S.tab === "day") S.date = S.date || S.today; render(); window.scrollTo(0,0); });
  $("#whoBtn").hidden = false; $("#whoBtn").textContent = (S.session.username || S.session.name || "") + " · " + t("signOut");
}

// ---------- render
function render(){
  if (!S.session){ renderLogin(); return; }
  setSync(); renderTabs();
  const v = S.tab;
  if (v === "day") renderDay(); else if (v === "period") renderPeriod(); else if (v === "feed") renderFeed(); else if (v === "account") renderAccount();
  else if (v === "team") renderTeam(); else if (v === "person") renderPerson(); else if (v === "entries") renderEntries(); else if (v === "flags") renderFlags(); else if (v === "settings") renderSettings();
}

// ---------- staff: day
function entryCard(e, flags){
  const off = !isWorking(e.workType), pend = S.outbox.some(x => x.id === e.id);
  return `<div class="card entry${off ? " offday" : ""}"><div class="top"><span class="chip ${off ? "off" : "ok"}">${esc(e.workType || "?")}</span><span class="row" style="gap:8px">${pend ? `<span class="pend">${esc(t("pending"))}</span>` : ""}<button class="btn sm" data-act="editEntry" data-id="${esc(e.id)}">${esc(t("editEntry"))}</button></span></div>
    ${e.area ? `<div class="area">${esc(e.area)}</div>` : ""}<div class="meta">${[e.activity, e.location].filter(Boolean).map(esc).join(" · ")}</div>
    ${e.summary ? `<div class="sum">${esc(e.summary)}</div>` : ""}${flags.map(flagBox).join("")}</div>`;
}
function flagBox(f){
  const open = f.status === "open";
  return `<div class="flagbox${f.status === "resolved" ? " done" : ""}"><div class="who">${esc(f.createdBy)} ${esc(t("asked"))} · ${esc(fmtShort((f.createdAt || "").slice(0,10) || S.today))} · <span class="chip ${open ? "warn" : f.status === "answered" ? "info" : "mute"}">${esc(open ? t("open") : t(f.status))}</span></div>
    <div class="q">${esc(f.message)}</div>${f.reply ? `<div class="a">${esc(f.reply)}</div>` : ""}
    ${f.reply && f.status === "answered" ? `<div class="row" style="margin-top:6px">${delBtn("reply", f.id, t("deleteMyReply"))}</div>` : ""}
    ${open ? `<textarea data-reply="${esc(f.id)}" placeholder="${esc(t("yourReply"))}"></textarea><div class="row" style="margin-top:6px"><button class="btn sm primary" data-act="sendReply" data-id="${esc(f.id)}">${esc(t("sendReply"))}</button></div>` : ""}</div>`;
}
function renderDay(){
  const d = S.date || S.today, mine = S.entries.filter(e => e.date === d && !e.deleted), st = dayStatus(d, S.entries);
  const dayFlags = S.flags.filter(f => f.entryDate === d), loose = dayFlags.filter(f => !f.entryId || !mine.some(e => e.id === f.entryId));
  const stChip = {filled:["ok",t("filled")], offd:["off",t("offDay")], missing:["bad",t("missing")], weekend:["mute",t("weekend")], future:["mute",t("future")]}[st];
  const editing = S.edit;
  $("#main").innerHTML = `<div class="dayhead"><button class="nav" data-act="shiftDay" data-n="-1" aria-label="Previous day">‹</button><div class="mid"><b>${esc(fmtDay(d))}</b><span>${dt(d).getFullYear()} · <span class="chip ${stChip[0]}">${esc(stChip[1])}</span></span></div><button class="nav" data-act="shiftDay" data-n="1" aria-label="Next day">›</button></div>
    <div class="daytools"><button class="btn sm" data-act="goToday">${esc(t("today"))}</button><input type="date" id="pickDate" value="${d}" aria-label="Date">${isAdmin() ? `<button class="btn sm" data-act="tab" data-v="period">${esc(t("period"))}</button>` : ""}</div>
    ${loose.map(f => `<div class="card">${flagBox(f)}</div>`).join("")}
    ${mine.length > 1 && !editing ? `<p class="small muted" style="margin:0 0 8px">${esc(t("partsDay").replace("{n}", mine.length))}</p>` : ""}
    ${mine.map(e => editing && !editing.isNew && editing.parts[0].id === e.id ? entryForm(editing) : entryCard(e, dayFlags.filter(f => f.entryId === e.id))).join("") || (editing ? "" : `<div class="empty" style="text-align:center">${esc(t("noEntries"))}</div>`)}
    ${editing && editing.isNew ? entryForm(editing) : ""}
    ${editing ? "" : `<div class="row" style="justify-content:center;margin-top:8px"><button class="btn primary" data-act="newEntry">+ ${esc(t("addEntry"))}</button>${mine.length ? "" : `<button class="btn" data-act="copyPrev">${esc(t("copyPrev"))}</button>`}</div>`}`;
  $("#pickDate").onchange = ev => { if (ev.target.value){ S.date = ev.target.value; S.edit = null; render(); } };
  if (editing) wireForm();
}
const blankPart = (loc) => ({id: nid(), workType: "", area: "", activity: "", location: loc || "", summary: ""});
function partHtml(e, i, n, isNew){
  const L2 = S.lists || {workTypes:[], areas:[]}, off = e.workType && !isWorking(e.workType), area = L2.areas.find(a => a.name === e.area), sx = i ? String(i) : "";
  return `<div class="part" data-i="${i}">${n > 1 || isNew ? `<div class="parthead"><b>${esc(t("partN").replace("{n}", i + 1))}</b>${i > 0 ? `<button class="btn sm ghost" type="button" data-act="removePart" data-i="${i}">${esc(t("removePart"))}</button>` : ""}</div>` : ""}
    <label class="f">${esc(t("workType"))}<select id="fWT${sx}" data-k="workType" data-i="${i}" required><option value=""></option>${L2.workTypes.map(w => `<option${w.name === e.workType ? " selected" : ""}>${esc(w.name)}</option>`).join("")}</select></label>
    <div class="g2"${off ? " hidden" : ""} id="areaRow${sx}"><label class="f">${esc(t("area"))}<select id="fArea${sx}" data-k="area" data-i="${i}"><option value="">${esc(t("pickArea"))}</option>${L2.areas.map(a => `<option${a.name === e.area ? " selected" : ""}>${esc(a.name)}</option>`).join("")}</select></label>
      <label class="f">${esc(t("activity"))}<select id="fAct${sx}" data-k="activity" data-i="${i}"><option value="">${esc(t("pickActivity"))}</option>${(area ? area.activities : []).map(x => `<option${x === e.activity ? " selected" : ""}>${esc(x)}</option>`).join("")}${e.activity && area && !area.activities.includes(e.activity) ? `<option selected>${esc(e.activity)}</option>` : ""}</select></label></div>
    <label class="f">${esc(t("location"))}<input id="fLoc${sx}" data-k="location" data-i="${i}" list="locList" value="${esc(e.location || "")}" autocomplete="off"></label>
    <label class="f">${esc(t("summary"))}${off ? ` (${esc(t("optional"))})` : ""}<textarea id="fSum${sx}" data-k="summary" data-i="${i}">${esc(e.summary || "")}</textarea></label></div>`;
}
function entryForm(ed){
  const locs = [...new Set(S.entries.map(x => x.location).filter(Boolean))].slice(-30), n = ed.parts.length;
  return `<form class="card" id="entryForm" style="display:flex;flex-direction:column;gap:12px">
    <h3>${esc(ed.isNew ? t("addEntry") : t("editEntry"))}</h3>
    ${ed.parts.map((e, i) => partHtml(e, i, n, ed.isNew)).join("")}<datalist id="locList">${locs.map(l => `<option value="${esc(l)}">`).join("")}</datalist>
    ${ed.isNew ? `<div><button class="btn sm" type="button" data-act="addPart">+ ${esc(t("addPart"))}</button><div class="small muted" style="margin-top:6px">${esc(t("addPartHint"))}</div></div>` : ""}
    <p class="small" id="fMsg" style="margin:0;color:var(--bad)"></p>
    <div class="row"><button class="btn primary" type="submit">${esc(t("save"))}</button><button class="btn" type="button" data-act="cancelEdit">${esc(t("cancel"))}</button><span class="grow"></span>${ed.isNew ? "" : `<button class="btn danger" type="button" data-act="delEntry" data-id="${esc(ed.parts[0].id)}">${esc(t("del"))}</button>`}</div></form>`;
}
function keepForm(){
  if (!S.edit || !$("#entryForm")) return;
  $$("#entryForm [data-k]").forEach(el => { const pt = S.edit.parts[+el.dataset.i]; if (pt) pt[el.dataset.k] = el.value; });
}
function wireForm(){
  $$("#entryForm select[data-k=workType]").forEach(el => el.onchange = () => { keepForm(); const id = el.id; renderDay(); const x = document.getElementById(id); if (x) x.focus(); });
  $$("#entryForm select[data-k=area]").forEach(el => el.onchange = () => { keepForm(); S.edit.parts[+el.dataset.i].activity = ""; const id = el.id; renderDay(); const x = document.getElementById(id); if (x) x.focus(); });
  $("#entryForm").onsubmit = ev => {
    ev.preventDefault(); keepForm(); const ed = S.edit, msg = $("#fMsg"), many = ed.parts.length > 1;
    for (let i = 0; i < ed.parts.length; i++){
      const e = ed.parts[i], pre = many ? t("partN").replace("{n}", i + 1) + ": " : "";
      if (!e.workType){ msg.textContent = pre + t("needWT"); return; }
      const off = !isWorking(e.workType);
      if (!off && !e.area){ msg.textContent = pre + t("needArea"); return; }
      if (!off && !e.summary.trim()){ msg.textContent = pre + t("needSum"); return; }
    }
    ed.parts.forEach(e => { const off = !isWorking(e.workType);
      saveLocal({id: e.id, date: ed.date, workType: e.workType, area: off ? "" : e.area, activity: off ? "" : e.activity, location: e.location.trim(), summary: e.summary.trim(), deleted: false}); });
    S.edit = null; toast(t("saved")); render();
  };
  setTimeout(() => { const f = $("#entryForm"); if (f) f.scrollIntoView({block:"nearest", behavior:"smooth"}); }, 30);
}

// ---------- staff: period
function calendar(start, list, flags, onClickAct){
  const end = periodEnd(start), days = daysIn(start, end), first = (dt(start).getDay() + 6) % 7;
  return `<div class="cal">${t("wd").map(w => `<div class="wd">${esc(w)}</div>`).join("")}${"<div class='pad'></div>".repeat(first)}${days.map(s => { const st = dayStatus(s, list), fl = flags.some(f => f.entryDate === s && f.status !== "resolved");
    const cls = fl ? "flag" : st, ot = isWeekend(s) && (st === "filled" || st === "offd");
    return `<button type="button" class="d ${cls}${isWeekend(s) ? " we" : ""}${s === S.today ? " today" : ""}" data-act="${onClickAct}" data-d="${s}" title="${esc(fmtDay(s) + " · " + t(cls === "flag" ? "flagged" : cls === "offd" ? "offDay" : cls === "filled" && ot ? "overtime" : cls))}">${dt(s).getDate()}<small>${s.slice(8) === "01" || s === start ? esc(t("months")[dt(s).getMonth()].slice(0,3)) : ""}</small>${fl && st === "filled" ? '<i class="dot"></i>' : ""}</button>`; }).join("")}</div>
    <div class="legend"><span><i style="background:var(--cal-ok)"></i>${esc(t("filled"))}</span><span><i style="background:var(--cal-miss)"></i>${esc(t("missing"))}</span><span><i style="background:var(--cal-flag)"></i>${esc(t("flagged"))}</span><span><i style="background:var(--cal-off)"></i>${esc(t("offDay"))}</span><span><i style="border:1px solid var(--line-2);opacity:.5"></i>${esc(t("weekend"))}</span></div>`;
}
function summaryTable(st){
  const L2 = S.lists || {workTypes:[]}, names = L2.workTypes.map(w => w.name).concat(Object.keys(st.byType).filter(k => !L2.workTypes.some(w => w.name === k)));
  return `<table class="sumtable">${names.map(n => `<tr><td>${esc(n)}</td><td>${st.byType[n] || 0}</td></tr>`).join("")}<tr class="tot"><td>${esc(t("totalWork"))}</td><td>${st.working}</td></tr><tr><td>${esc(t("notFilled"))}</td><td style="color:${st.missing ? "var(--bad)" : "inherit"}">${st.missing}</td></tr></table>`;
}
function renderPeriod(){
  S.pStart = S.pStart || periodStart(S.today); const st = periodStats(S.pStart, S.entries);
  $("#main").innerHTML = `<h1 class="pt">${esc(t("periodOverview"))}</h1>
    <div class="pnav"><button class="btn sm" data-act="shiftPeriod" data-n="-1">‹</button><b>${esc(periodLabel(S.pStart))}</b><button class="btn sm" data-act="shiftPeriod" data-n="1">›</button></div>
    <div class="card">${calendar(S.pStart, S.entries, S.flags, "openDay")}</div>
    <div class="card"><h3>${esc(t("summaryDays"))}</h3>${summaryTable(st)}<div class="row" style="margin-top:14px"><button class="btn" data-act="dlMine">${esc(t("dlMine"))}</button></div></div>`;
}

// ---------- staff: messages

            <p class="small muted" style="margin:0">${S.confirmDel === i && use ? esc(t("areaInUse").replace("{n}", use)) + " " : ""}${esc(t("pastKept"))}</p></div>` : ""}</div>`; }).join("") || `<div class="empty">—</div>`}</div></div>
    <div class="savebar" id="saveBar"${listsDirty() ? "" : " hidden"}><span>${esc(t("unsavedLists"))}</span><span class="grow"></span><button class="btn sm" type="button" data-act="discardLists">${esc(t("discard"))}</button><button class="btn sm primary" type="button" data-act="saveLists">${esc(t("saveLists"))}</button></div>`;

function drawLists(focusSel){
  const box = $("#listsBox"); if (!box) return; box.innerHTML = listsHtml(); wireLists();
  if (focusSel){ const el = $(focusSel); if (el){ el.focus(); if (el.setSelectionRange && el.value) el.setSelectionRange(el.value.length, el.value.length); } }
}
function markDirty(){ const b = $("#saveBar"); if (b) b.hidden = !listsDirty(); }
function wireLists(){
  $$("[data-wt]").forEach(i => i.oninput = () => { draft().workTypes[+i.dataset.wt].name = i.value; markDirty(); });
  $$("[data-wtw]").forEach(i => i.onchange = () => { draft().workTypes[+i.dataset.wtw].working = i.checked; markDirty(); });
  $$("[data-aname]").forEach(i => i.oninput = () => { draft().areas[+i.dataset.aname].name = i.value; markDirty(); });
  $$("[data-newact]").forEach(i => i.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); ACT.addAct({dataset:{i: i.dataset.newact}}); } });
  const q = $("#areaQ"); if (q) q.oninput = () => { S.areaQ = q.value; drawLists("#areaQ"); };
  const na = $("#newArea"); if (na){ na.focus(); na.onkeydown = e => { if (e.key === "Enter"){ e.preventDefault(); ACT.confirmAddArea(); } if (e.key === "Escape") ACT.cancelAddArea(); }; }
}
function cleanLists(D){
  const seen = new Set(), areas = [];
  for (const a of D.areas){ const name = a.name.trim(); if (!name) continue; const key = name.toLowerCase(); if (seen.has(key)) return {error: t("dupArea").replace("{name}", name)}; seen.add(key);
    const acts = []; a.activities.map(x => x.trim()).filter(Boolean).forEach(x => { if (!acts.some(y => y.toLowerCase() === x.toLowerCase())) acts.push(x); }); areas.push({name, activities: acts}); }
  const wts = D.workTypes.map(w => ({name: w.name.trim(), working: !!w.working})).filter(w => w.name);
  return {lists: {workTypes: wts, areas, periodStartDay: psd()}};
}

// ---------- Excel export in the timesheet template layout
async function download(name, blob){
  if (window.claude && window.claude.use){ try { const dl = await window.claude.use("downloads"); if (dl){ await dl.save({filename: name, data: blob}); return; } } catch(e){ if (e && e.code === "declined") return; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 800);
}
function personSheet(p, start, list){
  const end = periodEnd(start), st = periodStats(start, list), rows = [], merges = [];
  const label = fmtLongEn(start) + " to " + fmtLongEn(end);
  rows.push(["STAFF TIME REPORT"], ["Blue Forest  |  MozBlue Project, Mozambique"], ["Monthly timesheet"], []);
  rows.push(["Full name", p.name, "", "", "Period", label], ["Position", p.position || "", "", "", "Project", "MozBlue"], ["Duty station", p.station || "", "", "", "Direct line manager", p.lineManager || ""], []);
  rows.push(["Date", "Day", "Work type", "Activity area", "Activity", "Location", "Summary of tasks performed / results achieved"]);
  const WD = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  st.all.forEach(s => { const es = list.filter(e => e.date === s && !e.deleted), d = dt(s), x = xlSerial(s);
    if (!es.length) rows.push([x, WD[d.getDay()], "", "", "", "", ""]);
    es.forEach(e => rows.push([x, WD[d.getDay()], e.workType, e.area, e.activity, e.location, e.summary])); });
  rows.push([], ["Summary of days", "", "", "Days"]);
  (S.lists ? S.lists.workTypes : []).forEach(w => rows.push([w.name, "", "", st.byType[w.name] || 0]));
  rows.push(["Total working days", "", "", st.working], ["Weekdays not filled in", "", "", st.missing], []);
  rows.push(["Staff member", "", "", "Approval 1: Direct line manager", "", "Approval 2: Project Director"], ["Name: " + p.name, "", "", "Name: " + (p.lineManager || ""), "", "Name: "], ["Signature:", "", "", "Signature:", "", "Signature:"], ["Date:", "", "", "Date:", "", "Date:"]);
  const ws = XLSX.utils.aoa_to_sheet(rows); fmtDates(ws, 0);
  ws["!cols"] = [{wch:13},{wch:11},{wch:16},{wch:30},{wch:28},{wch:20},{wch:70}];
  return ws;
}
const xlSerial = s => { const [y,m,d] = s.split("-").map(Number); return (Date.UTC(y, m - 1, d) - Date.UTC(1899, 11, 30)) / 864e5; };
function fmtDates(ws, col){ const r = XLSX.utils.decode_range(ws["!ref"]); for (let i = r.s.r; i <= r.e.r; i++){ const c = ws[XLSX.utils.encode_cell({r:i, c:col})]; if (c && c.t === "n" && c.v > 40000 && c.v < 80000) c.z = "dd mmm yyyy"; } }
function fmtLongEn(s){ const d = dt(s); return d.getDate() + " " + L.en.months[d.getMonth()] + " " + d.getFullYear(); }
const safeSheet = n => n.replace(/[\\\/\?\*\[\]:]/g, " ").slice(0, 31);
async function exportPeople(people, start, entries, fname){
  if (!window.XLSX){ toast("…"); return; }
  const wb = XLSX.utils.book_new(), used = new Set();
  if (people.length > 1){
    const ov = [["Name","Position","Weekdays expected","Weekdays filled","Weekdays missing","Total working days","Open flags"]];
    people.forEach(p => { const st = periodStats(start, entries.filter(e => e.staffId === p.id)); ov.push([p.name, p.position || "", st.expected, st.filled, st.missing, st.working, (S.team ? S.team.flags : []).filter(f => f.staffId === p.id && f.status !== "resolved").length]); });
    const w = XLSX.utils.aoa_to_sheet(ov); w["!cols"] = [{wch:24},{wch:34},{wch:10},{wch:10},{wch:10},{wch:10},{wch:10}]; XLSX.utils.book_append_sheet(wb, w, "Overview");
  }
  people.forEach(p => { let n = safeSheet(p.name), k = 2; while (used.has(n)) n = safeSheet(p.name).slice(0, 28) + " " + k++; used.add(n); XLSX.utils.book_append_sheet(wb, personSheet(p, start, entries.filter(e => e.staffId === p.id)), n); });
  if (people.length > 1){
    const all = [["Name","Date","Day","Work type","Activity area","Activity","Location","Summary"]];
    entries.slice().sort((a,b) => a.staffId.localeCompare(b.staffId) || a.date.localeCompare(b.date)).forEach(e => { const p = people.find(x => x.id === e.staffId); if (p) all.push([p.name, xlSerial(e.date), ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][dt(e.date).getDay()], e.workType, e.area, e.activity, e.location, e.summary]); });
    const w = XLSX.utils.aoa_to_sheet(all); fmtDates(w, 1); w["!cols"] = [{wch:22},{wch:12},{wch:6},{wch:16},{wch:30},{wch:26},{wch:18},{wch:70}]; XLSX.utils.book_append_sheet(wb, w, "All entries");
  }
  await download(fname, new Blob([XLSX.write(wb, {type:"array", bookType:"xlsx"})], {type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));
}
const fileStamp = start => "Timesheet_BlueForest_MozBlue_" + L.en.months[dt(start).getMonth()] + dt(start).getFullYear();

  shiftPeriod: el => { S.pStart = shiftPeriod(S.pStart || periodStart(S.today), +el.dataset.n); S.composing = null; render(); },

  signOut: () => signOut(),

    const req = el.dataset.entry ? {entryId: el.dataset.entry, message: msg} : {targetId: el.dataset.staff, date: el.dataset.date, message: msg};
    try { const r = await authed("flagEntry", req); if (r.ok){ S.team.flags.push(r.flag); S.composing = null; toast(t("flagSent")); render(); } else toast(r.error); } catch(e){ toast(t("needOnline")); } },
  deleteFlag: el => flagDelete("flag", el.dataset.id),
  deleteReply: el => flagDelete("reply", el.dataset.id),

  exportFiltered: () => { const list = filteredEntries(), ids = [...new Set(list.map(e => e.staffId))], ppl = S.team.staff.filter(s => ids.includes(s.id)); exportPeople(ppl, S.pStart, list, fileStamp(S.pStart) + "_Filtered.xlsx"); },
  newStaff: () => { S.editStaff = {role: "staff", active: true}; renderSettings(); },

  resetPin: async el => { try { const r = await authed("resetPin", {targetId: el.dataset.id}); if (r.ok){ toast(t("pinResetDone")); S.team = null; renderSettings(); } } catch(e){ toast(t("needOnline")); } },
  addWT: () => { draft().workTypes.push({name: "", working: true}); drawLists(`[data-wt="${draft().workTypes.length - 1}"]`); markDirty(); },
  delWT: el => { draft().workTypes.splice(+el.dataset.i, 1); drawLists(); markDirty(); },

    if (draft().areas.some(a => a.name.trim().toLowerCase() === v.trim().toLowerCase())){ toast(t("dupArea").replace("{name}", v.trim())); return; }
    draft().areas.push({name: v.trim(), activities: []}); const i = draft().areas.length - 1; S.areaOpen = {[i]: true}; S.addingArea = false; S.areaQ = ""; drawLists(`[data-newact="${i}"]`); markDirty(); },
  addAct: el => { const i = +el.dataset.i, inp = $(`[data-newact="${i}"]`), v = inp ? inp.value.trim() : ""; if (!v) return; const acts = draft().areas[i].activities;

async function flagDelete(kind, id){
  const key = kind + ":" + id;
  if (S.confirmDel !== key){ S.confirmDel = key; clearTimeout(S.confirmT); S.confirmT = setTimeout(() => { if (S.confirmDel === key){ S.confirmDel = null; render(); } }, 5000); render(); return; }
  S.confirmDel = null;
  try {
    const r = await authed(kind === "flag" ? "deleteFlag" : "deleteReply", {flagId: id});
    if (!r.ok){ toast(errText(r.error)); return; }
    if (isAdmin() && S.team){ if (kind === "flag") S.team.flags = S.team.flags.filter(f => f.id !== id); else { const i = S.team.flags.findIndex(f => f.id === id); if (i >= 0) S.team.flags[i] = r.flag; } }
    if (kind === "flag") S.flags = S.flags.filter(f => f.id !== id); else { const j = S.flags.findIndex(f => f.id === id); if (j >= 0) S.flags[j] = r.flag; }
    persist(); toast(t(kind === "flag" ? "flagDeleted" : "replyDeleted")); render();
  } catch(e){ toast(t("needOnline")); }
}
